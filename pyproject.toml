[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-price-mlops"
version = "0.1.0"
description = "Modular house price prediction MLOps pipeline"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "joblib==1.6.0",
    "PyYAML==6.0.3",
    "mlflow==3.18.0",
    "skops==0.16.0",
    "fastapi==0.163.2",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx2",
    "dvc==3.67.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
house_price = ["demo.html", "demo_sample.json"]